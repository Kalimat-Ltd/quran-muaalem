services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./saved_audio:/app/saved_audio
      - ./sessions:/app/sessions
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped
